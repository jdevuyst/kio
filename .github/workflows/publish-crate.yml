# cargo-dist calls this publisher after its binary release succeeds.
name: Publish crate

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish kio-lang to crates.io
    if: >-
      github.repository == 'jdevuyst/kio' &&
      github.ref_type == 'tag' && startsWith(github.ref_name, 'releases/v') &&
      fromJSON(inputs.plan).announcement_tag == github.ref_name
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          version: 2026.6.14
          install_args: rust
          cache: false

      - name: Publish to crates.io
        working-directory: kio-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: sh ../ci/cargo.sh publish --locked  # zizmor: ignore[use-trusted-publishing]
