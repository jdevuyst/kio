# Publishes the kio-lang crate to crates.io on each release tag, so
# `cargo install kio-lang --bin kio` works. The binary release and the VS
# Code extension are handled by release.yml and publish-vscode.yml.
# Crate and extension publishing use `releases/v*`; the generated binary
# release uses `**[0-9]+.[0-9]+.[0-9]+*`. A
# `releases/v<major>.<minor>.<patch>` tag matches every channel at the
# repo-wide version.
#
# Requires CARGO_REGISTRY_TOKEN (a crates.io API token) as a secret of the
# `publish` environment this job declares. The job runs only on tags of the
# canonical repo; without the token the publish step fails.
name: Publish crate

on:
  push:
    tags:
      - 'releases/v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish kio-lang to crates.io
    if: github.repository == 'jdevuyst/kio'
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          version: 2026.6.14
          install_args: rust
          cache: false

      - name: Publish to crates.io
        working-directory: kio-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # A long-lived crates.io API token is the simplest first-publish
        # path; crates.io Trusted Publishing (OIDC, no stored secret) is a
        # stronger option worth adopting once the crate exists.
        run: sh ../ci/cargo.sh publish --locked  # zizmor: ignore[use-trusted-publishing]
