# cargo-dist calls this publisher after its binary release succeeds.
# Both registries and manual handoffs consume the same immutable run artifact.
name: Publish VS Code extension

on:
  workflow_call:
    secrets:
      VSCE_PAT:
        required: false
      OVSX_PAT:
        required: false
    inputs:
      plan:
        required: true
        type: string
      artifact-id:
        required: true
        type: string
      sha256:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  marketplace:
    name: Publish extension to Marketplace
    if: >-
      github.repository == 'jdevuyst/kio' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'releases/v') &&
      fromJSON(inputs.plan).announcement_tag == github.ref_name
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Check Marketplace credential
        id: credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning title=Marketplace publish skipped::VSCE_PAT is not set. Upload the kio-vsix artifact at https://marketplace.visualstudio.com/manage"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: steps.credential.outputs.available == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        if: steps.credential.outputs.available == 'true'
        with:
          version: 2026.6.14
          install_args: node
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        if: steps.credential.outputs.available == 'true'
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: tools/vscode-kio
          merge-multiple: true

      - name: Authenticate inspected payload
        if: steps.credential.outputs.available == 'true'
        working-directory: tools/vscode-kio
        env:
          VSIX_SHA256: ${{ inputs.sha256 }}
        run: |
          printf '%s  kio.vsix\n' "$VSIX_SHA256" | sha256sum --check --strict

      - name: Install publisher dependencies
        if: steps.credential.outputs.available == 'true'
        working-directory: tools/vscode-kio
        run: npm ci --no-fund --no-audit

      - name: Publish to the VS Code Marketplace
        if: steps.credential.outputs.available == 'true'
        working-directory: tools/vscode-kio
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath kio.vsix

  open-vsx:
    name: Publish extension to Open VSX
    if: >-
      github.repository == 'jdevuyst/kio' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'releases/v') &&
      fromJSON(inputs.plan).announcement_tag == github.ref_name
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Check Open VSX credential
        id: credential
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning title=Open VSX publish skipped::OVSX_PAT is not set. Upload the kio-vsix artifact at https://open-vsx.org"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: steps.credential.outputs.available == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        if: steps.credential.outputs.available == 'true'
        with:
          version: 2026.6.14
          install_args: node
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        if: steps.credential.outputs.available == 'true'
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: tools/vscode-kio
          merge-multiple: true

      - name: Authenticate inspected payload
        if: steps.credential.outputs.available == 'true'
        working-directory: tools/vscode-kio
        env:
          VSIX_SHA256: ${{ inputs.sha256 }}
        run: |
          printf '%s  kio.vsix\n' "$VSIX_SHA256" | sha256sum --check --strict

      - name: Install publisher dependencies
        if: steps.credential.outputs.available == 'true'
        working-directory: tools/vscode-kio
        run: npm ci --no-fund --no-audit

      - name: Publish to Open VSX
        if: steps.credential.outputs.available == 'true'
        working-directory: tools/vscode-kio
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish kio.vsix
