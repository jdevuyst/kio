name: Publish Dev Container
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'jdevuyst/kio' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/package-vscode.yml
  container:
    needs: package
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-candidate.yml
    with:
      artifact-id: ${{ needs.package.outputs.artifact-id }}
      sha256: ${{ needs.package.outputs.sha256 }}
