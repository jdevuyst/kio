name: Deploy prepared release website
on:
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy:
    if: >-
      github.repository == 'jdevuyst/kio' &&
      github.ref_type == 'tag' && fromJSON(inputs.plan).announcement_tag == github.ref_name
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
