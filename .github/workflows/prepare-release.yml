name: Prepare release before publication
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    outputs:
      ready:
        value: ${{ jobs.ready.outputs.ready }}
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
      sha256:
        value: ${{ jobs.package.outputs.sha256 }}
permissions:
  contents: read
jobs:
  fresh-installers:
    name: Fresh installer / ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Install from an empty owned store and compile twice
        shell: bash
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer_temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            installer_temp=$(cygpath -u "$installer_temp")
          fi
          export TMPDIR="$installer_temp/kio-fresh-tmp"
          mkdir -p "$TMPDIR" "$installer_temp/installer-receipt"
          export KIO_TOOLCHAINS_ROOT
          KIO_TOOLCHAINS_ROOT=$(mktemp -d "$installer_temp/kio-fresh-tools.XXXXXX")
          sh ci/infra/toolchain-fresh-install.sh "$installer_temp/installer-receipt" 2>&1 | tee "$installer_temp/installer-receipt/install.log"
      - name: Preserve installer evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: fresh-installer-${{ matrix.os }}
          path: ${{ runner.temp }}/installer-receipt
          if-no-files-found: error
  package:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.repository == 'jdevuyst/kio' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'releases/v') &&
      fromJSON(inputs.plan).announcement_tag == github.ref_name
    uses: ./.github/workflows/package-vscode.yml
    with:
      release-tag: ${{ github.ref_name }}
  container:
    needs: package
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-candidate.yml
    with:
      artifact-id: ${{ needs.package.outputs.artifact-id }}
      sha256: ${{ needs.package.outputs.sha256 }}
  crate:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchains
        with:
          selection: rust
      - name: Verify packaged crate without publishing
        working-directory: kio-rs
        run: sh ../ci/package-kio.sh publish --dry-run --locked
  website:
    needs: container
    uses: ./.github/workflows/build-release-site.yml
    with:
      image: ghcr.io/jdevuyst/kio-devcontainer@${{ needs.container.outputs.digest }}
  ready:
    needs: [package, container, crate, website]
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: All preparation passed; next phase freezes source and version
        id: ready
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
