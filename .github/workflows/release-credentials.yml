name: Release credential preflight
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
      VSCE_PAT:
        required: true
      OVSX_PAT:
        required: true
    outputs:
      verified:
        description: Credential checker actually completed successfully
        value: ${{ jobs.check.outputs.verified }}
permissions:
  contents: read
jobs:
  check:
    if: >-
      github.repository == 'jdevuyst/kio' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'releases/v')))
    runs-on: ubuntu-latest
    environment: publish
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchains
        with:
          selection: js,rust
          helpers: aqua:axodotdev/cargo-dist
      - name: Check exact generated release workflow
        run: |
          dist_version=$(sed -n 's/^cargo-dist-version = "\([^"]*\)"$/\1/p' dist-workspace.toml)
          test -n "$dist_version"
          node ci/infra/release-workflow.cjs --check
      - name: Install locked verification tools
        working-directory: tools/vscode-kio
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Verify stored publication credentials without publishing
        id: verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          node ci/infra/release-credentials.cjs
          echo 'verified=true' >> "$GITHUB_OUTPUT"
