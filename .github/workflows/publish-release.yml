name: Publish release
on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      VSCE_PAT:
        required: false
      OVSX_PAT:
        required: false
    inputs:
      plan:
        required: true
        type: string
      artifact-id:
        required: true
        type: string
      sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  crate:
    uses: ./.github/workflows/publish-crate.yml
    with:
      plan: ${{ inputs.plan }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  vscode:
    uses: ./.github/workflows/publish-vscode.yml
    with:
      plan: ${{ inputs.plan }}
      artifact-id: ${{ inputs.artifact-id }}
      sha256: ${{ inputs.sha256 }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
