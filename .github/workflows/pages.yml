# Deploy the static Kio website to GitHub Pages.
#
# This is a deploy workflow, not a replacement for the `ci/all.sh`
# Linux gate. The local mirror is `ci/checks/orchestrators/website-e2e.sh`.

name: Deploy Pages

on:
  # Deploys are manual. The published site therefore reflects the last
  # dispatch, not the tip of `main`; dispatch after landing a docs, spec,
  # or website change to republish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website artifact
    runs-on: ubuntu-latest
    container: ghcr.io/jdevuyst/kio-devcontainer:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build website
        run: |
          cd website
          npm ci --no-fund --no-audit
          npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
