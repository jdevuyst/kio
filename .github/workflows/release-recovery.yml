name: Resume release
run-name: Resume release (${{ inputs.release-tag }})
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing immutable release tag
        required: true
        type: string
      release-run-id:
        description: Original Release run with the VSIX and candidate image
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-recovery-${{ inputs.release-tag }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'jdevuyst/kio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.verify.outputs.source-sha }}
      digest: ${{ steps.verify.outputs.digest }}
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
      artifact-run-id: ${{ steps.verify.outputs.artifact-run-id }}
      sha256: ${{ steps.verify.outputs.sha256 }}
      plan: ${{ steps.verify.outputs.plan }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          version: 2026.6.14
          install_args: node
          cache: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Verify frozen source, original workflow and both-platform payload identity
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_RUN_ID: ${{ inputs.release-run-id }}
        run: node ci/infra/release-recovery.cjs
  credentials:
    needs: verify
    uses: ./.github/workflows/release-credentials.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
  container:
    needs: [verify, credentials]
    if: needs.credentials.outputs.verified == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/accept-container.yml
    with:
      source-sha: ${{ needs.verify.outputs.source-sha }}
      digest: ${{ needs.verify.outputs.digest }}
      artifact-id: ${{ needs.verify.outputs.artifact-id }}
      sha256: ${{ needs.verify.outputs.sha256 }}
  website:
    needs: [verify, container]
    uses: ./.github/workflows/build-release-site.yml
    with:
      source-sha: ${{ needs.verify.outputs.source-sha }}
      image: ghcr.io/jdevuyst/kio-devcontainer@${{ needs.verify.outputs.digest }}
  publish:
    needs: [verify, container, website]
    uses: ./.github/workflows/publish-release.yml
    with:
      plan: ${{ needs.verify.outputs.plan }}
      source-sha: ${{ needs.verify.outputs.source-sha }}
      artifact-id: ${{ needs.verify.outputs.artifact-id }}
      artifact-run-id: ${{ needs.verify.outputs.artifact-run-id }}
      sha256: ${{ needs.verify.outputs.sha256 }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
  deploy:
    needs: [verify, website, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-release-site.yml
    with:
      plan: ${{ needs.verify.outputs.plan }}
