[workspace]
members = ["cargo:kio-rs/dist"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Exact generated CI freshness is checked by ci/infra/release-workflow.cjs.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# All preparation and container promotion finish before immutable hosting.
github-release = "host"
plan-jobs = ["./release-credentials"]
global-artifacts-jobs = ["./prepare-release"]
publish-jobs = ["./publish-release"]
post-announce-jobs = ["./deploy-release-site"]
github-custom-job-permissions = { prepare-release = { contents = "read", packages = "write" }, publish-release = { contents = "read", actions = "read" }, deploy-release-site = { contents = "read", pages = "write", id-token = "write" } }
