min_version = "2026.6.14"

[settings]
idiomatic_version_file = false

[tools]
node = "24.21.0"
go = "1.27.2"
swift = "6.4.0"
java = "temurin-21.0.12+101.0.LTS"
ghcup = "0.2.6.2"
rust = { version = "1.99.0", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
actionlint = "1.7.7"
zizmor = "1.24.1"
sccache = "0.15.0"
tree-sitter = "0.26.9"
shellcheck = "0.9.0"
python = "3.12.15"
pipx = "1.4.3"
yamllint = "1.35.1"
ripgrep = "14.1.1"
"aqua:wasm-bindgen/wasm-pack" = "0.13.1"
"npm:typescript" = "6.0.3"
"npm:pyright" = "1.1.411"
"pipx:mypy" = "2.4.0"
"npm:markdownlint-cli2" = "0.22.1"
"github:mszostok/codeowners-validator[exe=codeowners-validator]" = "0.7.4"

# Firefox 157.0, paired with playwright-core 1.64.0 in website/package.json.
[tools."http:kio-firefox"]
version = "1555"
strip_components = 1
bin_path = "."

