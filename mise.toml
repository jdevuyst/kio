min_version = "2026.6.14"

[settings]
idiomatic_version_file = false

[tools]
node = "24.22.3"
go = "1.27.4"
swift = "6.4.0"
java = "temurin-21.0.13+9.0.LTS"
ghcup = "0.2.6.2"
rust = { version = "1.99.0", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
actionlint = "1.7.7"
zizmor = "1.24.1"
sccache = "0.15.0"
tree-sitter = "0.26.9"
shellcheck = "0.9.0"
python = "3.12.16"
pipx = "1.4.3"
yamllint = "1.35.1"
ripgrep = "14.1.1"
"aqua:wasm-bindgen/wasm-pack" = "0.13.1"
