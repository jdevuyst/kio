"npm:pyright" = "1.1.411"
"pipx:mypy" = "2.4.0"
"npm:markdownlint-cli2" = "0.22.1"
"github:mszostok/codeowners-validator[exe=codeowners-validator]" = "0.7.4"

# Firefox 159.0, paired with playwright-core 1.65.1 in website/package.json.
