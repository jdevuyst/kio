# Cargo-fuzz harness for kio-rs. Separate package (and its own
# workspace) so the libfuzzer-sys runtime and the nightly-only
# compiler flags don't leak into the parent kio-rs build.
#
# Build via `cargo +nightly fuzz run <target> -- -max_total_time=<N>`
# from the kio-rs/ directory; reports/fuzz.sh wraps the invocation.

[package]
name = "kio-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kio-lang = { path = "..", default-features = false }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

# Separate workspace marker so this crate doesn't inherit the
# parent's workspace settings (kio-rs/ has none today, but if one
# lands later the fuzz crate stays isolated).
[workspace]

# Cargo-fuzz convention: keep some debug info even in release
# builds so libFuzzer's stack traces are usable.
[profile.release]
debug = 1
